services:
  mongodb:
    image: mongo:8
    container_name: maia-care-mongodb

    ports:
      - '127.0.0.1:27017:27017'

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  mongodb_data:
